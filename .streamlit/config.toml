# HealthHub UI theme.
#
# This defines the LIGHT palette. Users can still switch Light / Dark from the
# top-right "⋮" menu -> Settings -> Appearance; every custom component in app.py
# (_inject_theme) is built on Streamlit's theme CSS variables + `color-mix`, so
# borders, surfaces and text follow the switch automatically.

[theme]
base = "light"
primaryColor = "#0d9488"           # teal - buttons, focus rings, active nav
backgroundColor = "#ffffff"         # main canvas
secondaryBackgroundColor = "#f3f4f6"  # sidebar, inputs, raised surfaces
textColor = "#1f2937"               # near-black slate
# Inter is @import-ed in app.py (_inject_theme); this makes native widgets use it too.
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
headingFont = "Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"
baseRadius = "0.7rem"               # consistent rounded corners on all widgets

[client]
showErrorDetails = true
toolbarMode = "viewer"
